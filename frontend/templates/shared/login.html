<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Авторизація - ZLAGODA</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>

  <body class="login_page d-flex align-items-center justify-content-center">
    <div class="position-absolute top-0 start-0 m-4 fw-bold fs-4 brand-logo">
      ZLAGODA
    </div>

    <div class="card auth-card border-0 rounded-4 p-5">
      <h2 class="text-center mb-4 fw-bold">Вхід</h2>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Логін</label>
          <input
            id="loginInput"
            type="text"
            class="form-control auth-input"
            placeholder="Введіть логін"
            required
          />
        </div>
        <div class="mb-4">
          <label class="form-label">Пароль</label>
          <input
            id="passwordInput"
            type="password"
            class="form-control auth-input"
            placeholder="Введіть пароль"
            required
          />
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
          Увійти
        </button>
      </form>

      <div id="alertMessage" class="text-center fw-bold mt-2"></div>
    </div>

    <script src="../../static/js/app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  </body>
</html>
