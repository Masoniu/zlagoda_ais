<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Клієнти</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body class="manager_layout">
    <div id="navbar_placeholder"></div>

    <main class="container mt-5">
      <h2 class="mb-4 fw-bold">Карти клієнтів</h2>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="input-group search-container">
          <span class="input-group-text bg-white border-0 ps-3">
            <i class="bi bi-search icon-zlagoda"></i>
          </span>
          <input
            type="text"
            id="customerSearch"
            class="form-control border-0 shadow-none ps-2"
            placeholder="Пошук за прізвищем"
          />
        </div>
        <button
          class="btn btn-primary btn-add-new fw-bold px-4 py-2 shadow-sm rounded-3"
          data-bs-toggle="modal"
          data-bs-target="#addCustomerModal"
        >
          + Додати клієнта
        </button>
      </div>

      <!--TABLE-->
      <div class="card border-0 shadow-sm rounded-4 mt-5">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="zlagoda_table_header">
              <tr>
                <th class="ps-4">ID</th>
                <th
                  class="sortable-header"
                  onclick="
                    sortTableData(
                      mockCustomers,
                      'surname',
                      'string',
                      renderCustomers,
                    )
                  "
                >
                  ПІБ
                  <i class="bi bi-arrow-down-up small text-muted ms-1"></i>
                </th>
                <th>Телефон</th>
                <th>Знижка</th>
                <th class="text-end pe-4">Дії</th>
              </tr>
            </thead>
            <tbody id="customerTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!--WINDOW FOR NEW CUSTOMER-->
    <div
      class="modal fade"
      id="addCustomerModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Картка лояльності</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body p-4">
            <form id="addCustomerForm">
              <input type="hidden" id="editCustomerCardNumber" />

              <div class="row g-3 mb-3">
                <div class="col-md-4">
                  <label class="form-label small fw-bold">Прізвище*</label>
                  <input
                    type="text"
                    class="form-control auth-input"
                    id="custSurnameInput"
                    required
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold">Ім'я*</label>
                  <input
                    type="text"
                    class="form-control auth-input"
                    id="custNameInput"
                    required
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold">По батькові</label>
                  <input
                    type="text"
                    class="form-control auth-input"
                    id="custPatronymicInput"
                  />
                </div>
              </div>
              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label small fw-bold"
                    >Контактний тел.*</label
                  >
                  <input
                    type="tel"
                    class="form-control auth-input"
                    id="custPhoneInput"
                    placeholder="+380..."
                    maxlength="13"
                    required
                  />
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold"
                    >Відсоток знижки*</label
                  >
                  <input
                    type="number"
                    class="form-control auth-input"
                    id="custPercentInput"
                    min="0"
                    max="100"
                    required
                  />
                </div>
              </div>
              <h6 class="fw-bold mb-3 border-top pt-4">Адреса</h6>
              <div class="row g-3 mb-4">
                <div class="col-md-5">
                  <label class="form-label small fw-bold">Місто</label>
                  <input
                    type="text"
                    class="form-control auth-input"
                    id="custCityInput"
                  />
                </div>
                <div class="col-md-7">
                  <label class="form-label small fw-bold"
                    >Вулиця та Індекс</label
                  >
                  <div class="input-group">
                    <input
                      type="text"
                      class="form-control auth-input w-75"
                      id="custStreetInput"
                      placeholder="вул..."
                    />
                    <input
                      type="text"
                      class="form-control auth-input w-25"
                      id="custZipInput"
                      placeholder="00000"
                    />
                  </div>
                </div>
              </div>

              <div class="text-end border-top pt-3">
                <button type="submit" class="btn btn-primary px-5 py-2 fw-bold">
                  Зберегти клієнта
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!--WINDOW FOR VIEWING CUSTOMER DETAILS-->
    <div
      class="modal fade"
      id="viewCustomerModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow-lg">
          <div
            class="modal-header border-0 rounded-top-4 bg-light"
            id="v-cust-header"
          >
            <h5 class="modal-title fw-bold">Досьє клієнта</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body p-4">
            <div class="text-center mb-4">
              <div class="display-1">
                <i class="bi bi-credit-card-2-front icon_zlagoda"></i>
              </div>
              <div id="v-cust-id" class="text-muted small mb-2"></div>
              <h4 id="v-cust-fullName" class="fw-bold mb-2"></h4>
              <span
                class="badge bg-success bg-opacity-10 text-success border border-success p-2 fs-6"
              >
                Знижка: <span id="v-cust-percent"></span>%
              </span>
            </div>
            <div class="row g-3">
              <div class="col-12">
                <p class="small text-muted mb-0">Телефон</p>
                <p id="v-cust-phone" class="fw-semibold mb-0"></p>
              </div>
              <div class="col-12 border-top pt-2">
                <p class="small text-muted mb-0">Адреса</p>
                <p id="v-cust-address" class="fw-semibold mb-0"></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="modals_placeholder"></div>
    <script src="../../static/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
