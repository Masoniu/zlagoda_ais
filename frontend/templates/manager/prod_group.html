<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Менеджер - Категорії товарів</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body class="manager_layout">
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand brand_logo fw-bold fs-4" href="home.html"
          >ZLAGODA</a
        >
        <button
          class="navbar-toggler border-white"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav gap-3">
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="produce.html"
                >Товари</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="prod_group.html"
                >Категорії</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="home.html"
                >Працівники</a
              >
            </li>
          </ul>
        </div>

        <div class="d-flex align-items-center">
          <span
            class="navbar-text text-white me-3 d-none d-sm-inline"
            id="userNameDisplay"
          >
            Іван Іванов
          </span>
          <button class="btn btn_nav btn-sm fw-bold px-3 py-2" id="logoutBtn">
            Вийти
          </button>
        </div>
      </div>
    </nav>

    <main class="container mt-5">
      <h2 class="mb-4">Категорії товарів</h2>

      <div class="row mb-3 align-items-center">
        <div class="col-md-4">
          <input
            type="text"
            id="categorySearch"
            class="form-control search_input"
            placeholder="Пошук за назвою"
          />
        </div>
        <div class="col-md-8 text-end">
          <button
            class="btn btn-primary fw-bold px-4"
            data-bs-toggle="modal"
            data-bs-target="#addCategoryModal"
          >
            + Додати категорію
          </button>
        </div>
      </div>

      <div class="card border-0 shadow-sm rounded-4 mt-5">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="zlagoda_table_header">
              <tr>
                <th class="ps-4">Номер (ID)</th>
                <th>Назва категорії</th>
                <th class="text-end pe-4">Дії</th>
              </tr>
            </thead>
            <tbody id="categoryTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>
    <div
      class="modal fade"
      id="addCategoryModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold">Нова категорія</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addCategoryForm">
              <div class="mb-3">
                <label class="form-label">Назва категорії</label>
                <input
                  type="text"
                  class="form-control auth-input"
                  id="categoryNameInput"
                  required
                />
              </div>
              <div class="text-end">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Скасувати
                </button>
                <button type="submit" class="btn btn-primary ms-2">
                  Зберегти
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="../../static/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
