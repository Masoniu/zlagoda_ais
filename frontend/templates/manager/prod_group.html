<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Категорії товарів</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>

  <body class="manager_layout">
    <div id="navbar_placeholder"></div>

    <main class="container mt-5">
      <h2 class="mb-4 fw-bold">Категорії товарів</h2>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="input-group search-container flex-grow-1">
          <span class="input-group-text bg-white border-0 ps-3">
            <i class="bi bi-search icon-zlagoda"></i>
          </span>
          <input
            type="text"
            id="categorySearch"
            class="form-control border-0 shadow-none ps-2"
            placeholder="Пошук за назвою"
          />
        </div>

        <div class="d-flex align-items-center gap-3">
          <button
            class="btn btn-primary fw-bold px-4 py-2 shadow-sm rounded-3"
            data-bs-toggle="modal"
            data-bs-target="#addCategoryModal"
          >
            + Додати категорію
          </button>
          <button
            class="btn btn-outline-secondary btn_printer fw-bold px-4 py-2 shadow-sm rounded-3 bg-white"
            onclick="generateReport('Персонал магазину', 'employeeTableBody')"
          >
            <i class="bi bi-printer me-2"></i>Друк звіту
          </button>
        </div>
      </div>

      <!--TABLE-->
      <div class="card border-0 shadow-sm rounded-4 mt-5">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="zlagoda_table_header">
              <tr>
                <th class="ps-4">ID</th>
                <th class="sortable-header" onclick="handleSort('categories')">
                    Назва категорії
                    <i class="bi bi-arrow-down-up small text-muted ms-1">
                    </i>
                </th>
                <th class="text-end pe-4">Дії</th>
              </tr>
            </thead>
            <tbody id="categoryTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!--WINDOW FOR NEW CATEGORY-->
    <div
      class="modal fade"
      id="addCategoryModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold">Нова категорія</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addCategoryForm">
              <input type="hidden" id="editCategoryId" />
              <div class="mb-3">
                <label class="form-label fw-semibold">Назва категорії*</label>
                <input
                  type="text"
                  class="form-control auth-input"
                  id="categoryNameInput"
                  required
                />
              </div>
              <div class="text-end">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Скасувати
                </button>
                <button type="submit" class="btn btn-primary ms-2">
                  Зберегти
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div id="modals_placeholder"></div>
    <script src="../../static/js/api.js"></script>
    <script src="../../static/js/utils.js"></script>
    <script src="../../static/js/filters.js"></script>
    <script src="../../static/js/pos.js"></script>
    <script src="../../static/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
