<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Менеджер</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body class="manager_layout">
    <!--NAVIGATION PANEL-->
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand brand_logo fw-bold fs-4" href="home.html"
          >ZLAGODA</a
        >
        <button
          class="navbar-toggler border-white"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav gap-3">
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="produce.html"
                >Товари</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="prod_group.html"
                >Категорії</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="workers.html"
                >Працівники</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="customers.html"
                >Клієнти</a
              >
            </li>
          </ul>
        </div>
        <div class="d-flex align-items-center">
          <span
            class="navbar-text text-white me-3 d-none d-sm-inline"
            id="userNameDisplay"
          >
          </span>
          <button class="btn btn_nav btn-sm fw-bold px-3 py-2" id="logoutBtn">
            Вийти
          </button>
        </div>
      </div>
    </nav>

    <main class="welcome_wrapper">
      <div class="text-center p-5 rounded-4 shadow-sm welcome_card">
        <h1 id="dynamicGreeting" class="fw-bold display-4"></h1>
        <p class="fs-5 opacity-75 mt-3">Який сьогодні класний день!</p>
      </div>
    </main>

    <!--WINDOW TO CONFIRM LOGOUT-->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
          <div class="modal-body text-center p-4">
            <div class="mb-3">
              <i class="bi bi-door-open icon-zlagoda fs-1"></i>
            </div>
            <h5 class="fw-bold mb-3">Вже йдете?</h5>
            <p class="text-muted small">
              Ви впевнені, що хочете вийти з облікового запису?
            </p>
            <div class="d-flex gap-2 mt-4">
              <button
                type="button"
                class="btn btn-light w-100 rounded-3"
                data-bs-dismiss="modal"
              >
                Скасувати
              </button>
              <button
                type="button"
                id="confirmLogout"
                class="btn btn_delete w-100 rounded-3"
              >
                Вийти
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../../static/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
