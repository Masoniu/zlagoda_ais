<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Менеджер - товари в магазині</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body class="manager_layout">
    <!--NAVIGATION PANEL-->
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
      <div class="container-fluid px-4">
        <a class="navbar-brand brand_logo fw-bold fs-4" href="home.html"
          >ZLAGODA</a
        >
        <button
          class="navbar-toggler border-white"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div
          class="collapse navbar-collapse justify-content-center"
          id="navbarNav"
        >
          <ul class="navbar-nav gap-3">
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="produce.html"
                >Товари</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link text-white fw-semibold"
                href="store_produce.html"
                >Товари в магазині</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="prod_group.html"
                >Категорії</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="workers.html"
                >Працівники</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fw-semibold" href="customers.html"
                >Клієнти</a
              >
            </li>
          </ul>
        </div>
        <div class="d-flex align-items-center">
          <span
            class="navbar-text text-white me-3 d-none d-sm-inline"
            id="userNameDisplay"
          ></span>
          <button class="btn btn_nav btn-sm fw-bold px-3 py-2" id="logoutBtn">
            Вийти
          </button>
        </div>
      </div>
    </nav>

    <main class="container mt-5">
      <h2 class="mb-4 fw-bold">Наявність товарів у магазині</h2>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="input-group search-container">
          <span class="input-group-text bg-white border-0 ps-3">
            <i class="bi bi-search icon-zlagoda"></i>
          </span>
          <input
            type="text"
            id="storeProductSearch"
            class="form-control border-0 shadow-none ps-2"
            placeholder="Пошук за UPC..."
          />
        </div>
        <button
          class="btn btn-primary fw-bold px-4 py-2 shadow-sm rounded-3"
          data-bs-toggle="modal"
          data-bs-target="#addStoreProductModal"
        >
          + Додати партію товару
        </button>
      </div>

      <!--TABLE-->
      <div class="card border-0 shadow-sm rounded-4 mt-5">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="zlagoda_table_header">
              <tr>
                <th class="ps-4">UPC</th>
                <th>Назва товару</th>
                <th>Ціна (грн)</th>
                <th>Кількість</th>
                <th>Акція</th>
                <th class="text-end pe-4">Дії</th>
              </tr>
            </thead>
            <tbody id="storeProductTableBody"></tbody>
          </table>
        </div>
      </div>
    </main>

    <!--WINDOW FOR ADDING STORE PRODUCT-->
    <div
      class="modal fade"
      id="addStoreProductModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title fw-bold">Товар на полиці</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body p-4">
            <form id="addStoreProductForm">
              <input type="hidden" id="isEditMode" value="false" />

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label small fw-bold">UPC*</label>
                  <input
                    type="text"
                    class="form-control auth-input text-uppercase"
                    id="spUpcInput"
                    maxlength="12"
                    placeholder="Напр. 123456789012"
                    required
                  />
                  <div class="form-text small">До 12 символів.</div>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-bold"
                    >Оберіть товар з довідника*</label
                  >
                  <select
                    class="form-select auth-input"
                    id="spProductSelect"
                    required
                  ></select>
                </div>
              </div>

              <div class="row g-3 mb-4 align-items-end">
                <div class="col-md-4">
                  <label class="form-label small fw-bold">Ціна продажу*</label>
                  <input
                    type="number"
                    step="0.01"
                    min="0"
                    class="form-control auth-input"
                    id="spPriceInput"
                    required
                  />
                </div>
                <div class="col-md-4">
                  <label class="form-label small fw-bold"
                    >Кількість одиниць*</label
                  >
                  <input
                    type="number"
                    min="0"
                    class="form-control auth-input"
                    id="spQuantityInput"
                    required
                  />
                </div>
                <div class="col-md-4">
                  <div class="form-group">
                    <label class="form-label small fw-bold mb-2"
                      >Акційний товар</label
                    >
                    <div
                      class="form-check form-switch d-flex align-items-center ps-0 m-0"
                    >
                      <input
                        class="form-check-input mt-0 ms-0 me-2 zlagoda-switch"
                        type="checkbox"
                        role="switch"
                        id="spPromoInput"
                      />
                      <span class="text-muted small mb-0" id="promoStatusText"
                        >Ні</span
                      >
                    </div>
                  </div>
                </div>
              </div>

              <div
                class="d-flex justify-content-end align-items-center gap-3 border-top pt-3"
              >
                <span id="spAlertMessage" class="small fw-bold"></span>
                <button type="submit" class="btn btn-primary px-5 py-2 fw-bold">
                  Зберегти
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!--WINDOW TO CONFIRM LOGOUT-->
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-sm modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow">
          <div class="modal-body text-center p-4">
            <div class="mb-3">
              <i class="bi bi-door-open icon-zlagoda fs-1"></i>
            </div>
            <h5 class="fw-bold mb-3">Вже йдете?</h5>
            <p class="text-muted small">
              Ви впевнені, що хочете вийти з облікового запису?
            </p>
            <div class="d-flex gap-2 mt-4">
              <button
                type="button"
                class="btn btn-light w-100 rounded-3"
                data-bs-dismiss="modal"
              >
                Скасувати
              </button>
              <button
                type="button"
                id="confirmLogout"
                class="btn btn_delete w-100 rounded-3"
              >
                Вийти
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../../static/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
