<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каса</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body class="cashier_layout">
    <div id="navbar_placeholder"></div>

    <main class="container mt-4">
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4 bg-light rounded-4">
              <form id="posScanForm" class="d-flex gap-3">
                <div class="input-group input-group-lg">
                  <span class="input-group-text bg-white border-0"
                    ><i class="bi bi-upc-scan icon-zlagoda"></i
                  ></span>
                  <input
                    type="text"
                    id="posUpcInput"
                    class="form-control border-0 shadow-none fw-bold"
                    placeholder="Відскануйте або введіть UPC товару"
                    autofocus
                    autocomplete="off"
                    required
                  />
                </div>
                <button
                  type="submit"
                  class="btn btn-primary px-4 fw-bold rounded-3 flex-shrink-0"
                >
                  + Додати
                </button>
              </form>
            </div>
          </div>

          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-0">
              <table class="table table-hover mb-0">
                <thead class="zlagoda_table_header">
                  <tr>
                    <th class="ps-4">Товар</th>
                    <th>Ціна</th>
                    <th class="text-center">К-сть</th>
                    <th>Сума</th>
                    <th class="text-end pe-4"></th>
                  </tr>
                </thead>
                <tbody id="posTableBody">
                  <tr>
                    <td colspan="5" class="text-center text-muted py-5">
                      Чек порожній. Відскануйте товар.
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-lg-4">
          <div
            class="card border-0 shadow-sm rounded-4 sticky-top"
            style="top: 100px"
          >
            <div class="card-body p-4">
              <h5 class="fw-bold mb-4">Розрахунок</h5>

              <form id="posCardForm" class="mb-4">
                <label class="form-label small fw-bold text-muted"
                  >Картка лояльності</label
                >
                <div class="input-group">
                  <input
                    type="text"
                    id="posCardInput"
                    class="form-control auth-input"
                    placeholder="Номер картки"
                  />
                  <button type="submit" class="btn btn-outline-secondary">
                    Застосувати
                  </button>
                </div>
                <div
                  id="posCardResult"
                  class="small mt-2 fw-semibold text-success"
                ></div>
              </form>

              <hr class="text-muted" />

              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Початкова сума:</span>
                <span class="fw-semibold"
                  ><span id="posSubtotal">0.00</span> грн</span
                >
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Знижка клієнта:</span>
                <span class="fw-semibold text-success sale"
                  >- <span id="posDiscount">0.00</span> грн</span
                >
              </div>
              <div class="d-flex justify-content-between mb-3">
                <span class="text-muted small">В т.ч. ПДВ (20%):</span>
                <span class="text-muted small"
                  ><span id="posVat">0.00</span> грн</span
                >
              </div>

              <div
                class="d-flex justify-content-between align-items-center bg-light p-3 rounded-3 mb-4 border"
              >
                <span class="fs-5 fw-bold text-dark">До сплати:</span>
                <span class="fs-4 fw-bold text-success total"
                  ><span id="posTotal">0.00</span> грн</span
                >
              </div>

              <button
                id="posPayBtn"
                class="btn btn-success w-100 py-3 fw-bold fs-5 rounded-3 shadow-sm"
                disabled
              >
                <i class="bi bi-cash-coin me-2"></i> ОПЛАТИТИ
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="modals_placeholder"></div>
    <script src="../../static/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
